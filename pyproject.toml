[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "proscenium"
version = "1.0.0"
description = "Markdown decks, lit for the terminal: real math, charts, reveals."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Atom Moss Studios" }]
keywords = ["slides", "presentation", "markdown", "terminal", "latex", "tui", "theatre"]
dependencies = ["rich>=13.7"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics :: Presentation",
    "Topic :: Text Processing :: Markup :: Markdown",
]

[project.urls]
Homepage = "https://github.com/atommossstudios/proscenium"
Source = "https://github.com/atommossstudios/proscenium"
Issues = "https://github.com/atommossstudios/proscenium/issues"

[project.optional-dependencies]
dev = ["pytest>=7", "build>=1"]

[project.scripts]
proscenium = "proscenium.cli:main"
cue = "proscenium.cli:main"

[tool.setuptools]
packages = ["proscenium"]

[tool.setuptools.package-data]
proscenium = ["py.typed"]

[tool.setuptools.data-files]
"share/doc/proscenium" = ["demo.md", "formatting.md", "showcase.md"]
"share/doc/proscenium/assets" = ["assets/demo.png"]

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]
